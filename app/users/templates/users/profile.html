{% extends 'base.html' %}

{% block title %}Profile Page{% endblock %}

{% block content %}
<div class="container mt-5 {% if color_scheme == 'dark' %}bg-dark text-white{% else %}bg-light text-dark{% endif %}">
    <h1>Вітаю, {{ username }}!</h1>

    <a href="{{ url_for('user_name.logout') }}" class="btn btn-danger mb-3">Вийти</a>

    <div class="mb-3">
        <a href="{{ url_for('user_name.set_color_scheme', color='light') }}" class="btn btn-secondary">Світла схема</a>
        <a href="{{ url_for('user_name.set_color_scheme', color='dark') }}" class="btn btn-dark">Темна схема</a>
    </div>

    <h3>Поточні кукі</h3>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Ключ</th>
                <th>Значення</th>
            </tr>
        </thead>
        <tbody>
            {% for key, value in cookies.items() %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h3>Управління кукі</h3>
    <form method="post">
        <div class="mb-3">
            <label for="key" class="form-label">Ключ кукі:</label>
            <input type="text" id="key" name="key" class="form-control">
        </div>
        <div class="mb-3">
            <label for="value" class="form-label">Значення:</label>
            <input type="text" id="value" name="value" class="form-control">
        </div>
        <div class="mb-3">
            <label for="max_age" class="form-label">Термін дії (в секундах):</label>
            <input type="number" id="max_age" name="max_age" class="form-control">
        </div>
        <button type="submit" name="action" value="add" class="btn btn-success">Додати кукі</button>
        <button type="submit" name="action" value="delete" class="btn btn-warning">Видалити кукі</button>
        <button type="submit" name="action" value="delete_all" class="btn btn-danger">Видалити всі кукі</button>
    </form>
</div>
{% endblock %}
