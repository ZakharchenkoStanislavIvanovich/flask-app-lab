{% extends 'base.html' %}

{% block content %}
<h2>Add New Post</h2>
<form method="POST" action="" novalidate>
    {{ form.hidden_tag() }}
    {% from 'form_macros.html' import render_field %}
    {{ render_field(form.title) }}
    {{ render_field(form.content) }}
    {{ form.submit(class="btn btn-primary") }}
</form>
{% endblock %}
